plugins {
    id 'com.android.application'
}

android {
    namespace 'lv.latviantube'
    compileSdk 34

    defaultConfig {
        applicationId 'lv.latviantube'
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName '1.1'

        // The app is Latvian-only by design; these are defaults, and
        // InnerTubeClient pins hl/gl per request regardless of device locale.
        resourceConfigurations += ['lv', 'en']
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.all {
            systemProperty 'latviantube.live', System.getenv('LATVIANTUBE_LIVE_TESTS') == '1'
            systemProperty 'latviantube.liveVideoId', System.getenv('LATVIANTUBE_LIVE_VIDEO_ID') ?: 'jNQXAC9IVRw'
        }
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        // Latvian is the base locale here, so the usual "missing translation"
        // warnings for every other language do not apply.
        disable 'MissingTranslation', 'ExtraTranslation'
        abortOnError false
    }

    packaging {
        resources.excludes += ['META-INF/*.kotlin_module']
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "LatvianTube_v.${variant.versionName}.apk"
        }
    }
}

dependencies {
    // Android TV / Leanback. Unlike SmartTube we use the stock artifacts —
    // its in-tree Leanback and Fragment forks exist to support minSdk 17 and
    // to patch TV focus behaviour for hardware from 2013.
    implementation 'androidx.leanback:leanback:1.0.0'
    implementation 'androidx.leanback:leanback-preference:1.0.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core:1.12.0'

    // InnerTube transport.
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Thumbnail loading.
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    // 1.4.1 retains API 21 / compileSdk 34 support. Keep all Media3 modules aligned.
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.4.1'
    implementation 'androidx.media3:media3-datasource-okhttp:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'

    // Approved GPL-3.0-or-later dependency; see THIRD_PARTY.md before distribution.
    implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.26.5'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.0.4'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}
